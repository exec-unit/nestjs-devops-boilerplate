# ============================================================================
# NestJS Boilerplate - Core Application Microservices
# ============================================================================
# This file contains definitions for all custom microservices.
# Infrastructure services (postgres, redis, nginx, etc.) are located in:
#   - compose/infra.yml (core infrastructure)
#   - compose/monitoring.yml (monitoring stack)
#
# Usage:
#   Set ENVIRONMENT in .env.infra, then:
#   make up      - start services
#   make down    - stop services
#   make restart - restart services
# ============================================================================

# Shared network for all services
networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-boilerplate_net}
    external: true

services:
  user-service:
    image: ${REGISTRY_URL:-ghcr.io/your-github-username}/user-service:${USER_SERVICE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user-service
    container_name: ${CONTAINER_PREFIX}-user-service
    env_file:
      - apps/user-service/.env
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
