# =============================================================================
# Reusable Workflow: Build Docker Images
# Purpose: Build and push Docker images for changed apps to container registry
# Called by: deploy-staging.yml, release-production.yml
# =============================================================================
name: Build Images

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Environment: staging or production"
      apps:
        required: true
        type: string
        description: "JSON array of apps to build"
      version:
        required: true
        type: string
        description: "Docker image tag version"
      max_parallel:
        required: false
        type: number
        default: 0
        description: "Max parallel builds (0 = unlimited)"
    secrets:
      GHCR_PAT:
        required: true

jobs:
  build:
    name: Build ${{ matrix.app }}
    if: inputs.apps != '[]'
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel > 0 && inputs.max_parallel || 999 }}
      matrix:
        app: ${{ fromJSON(inputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            APP_NAME=${{ matrix.app }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
