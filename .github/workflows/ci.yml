# =============================================================================
# CI Pipeline: Path-based validation for services and infrastructure
# Triggers: Pull requests to main branch OR manual dispatch
# Strategy: Only run jobs for changed components (cost optimization)
# =============================================================================
name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read
  security-events: write

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Manual trigger: allows running CI on any branch without creating PR
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run all jobs (ignore path filters)"
        required: false
        type: boolean
        default: false

jobs:
  # Detect which parts of monorepo changed
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      iac: ${{ steps.filter.outputs.iac }}
      apps-list: ${{ steps.set-matrix.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Detect path changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
            iac:
              - 'infrastructure/ansible/**'
              - 'compose/**'
              - 'config/**'

      - name: Get changed files
        if: steps.filter.outputs.apps == 'true'
        id: changed-files
        uses: step-security/changed-files@60967b822d3001fa82242f8d6b4ed46bc3600a68
        with:
          files: apps/**
          dir_names: true
          dir_names_max_depth: 2

      - name: Discover changed apps
        id: set-matrix
        if: steps.filter.outputs.apps == 'true'
        run: |
          if [ -n "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            # Extract app names: remove 'apps/' prefix and filter out 'apps' itself
            APPS=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | \
              sed 's|^apps/||' | grep -v '^apps$' | sort -u | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "Changed apps: $APPS"
            echo "apps=$APPS" >> $GITHUB_OUTPUT
          else
            echo "apps=[]" >> $GITHUB_OUTPUT
          fi

  # Validate Infrastructure as Code (Ansible)
  lint-iac:
    name: Lint IaC
    needs: detect-changes
    if: needs.detect-changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Generate cache key dependencies
        run: |
          echo "ansible==13.0.0" >> temp-deps.txt
          echo "ansible-lint==25.11.1" >> temp-deps.txt

      - name: Cache pip packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('temp-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: pip install ansible==13.0.0 ansible-lint==25.11.1

      - name: Run ansible-lint
        run: cd infrastructure/ansible && ansible-lint roles/ --exclude 'roles/*/molecule/'

  # Build and test changed services (parallel execution)
  build-test-apps:
    name: Build & Test ${{ matrix.app }}
    needs: detect-changes
    if: needs.detect-changes.outputs.apps == 'true' && needs.detect-changes.outputs.apps-list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps-list) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies and Build
        run: |
          # If it's a pnpm workspace, installing at root is best, but we'll try inside the service too just in case
          if [ -f "pnpm-workspace.yaml" ]; then
            pnpm install --frozen-lockfile
          fi
          cd apps/${{ matrix.app }}
          # Fallback install if not a workspace
          if [ ! -d "../../node_modules" ]; then
             pnpm install
          fi
          pnpm run lint || true
          pnpm run test || true
          pnpm run build

  # Security scan with Trivy (CRITICAL/HIGH vulnerabilities)
  scan-apps:
    name: Scan ${{ matrix.app }}
    needs: [detect-changes, build-test-apps]
    if: needs.detect-changes.outputs.apps == 'true' && needs.detect-changes.outputs.apps-list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps-list) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          file: ./Dockerfile
          build-args: |
            APP_NAME=${{ matrix.app }}
          push: false
          load: true
          tags: ${{ matrix.app }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.app }}:pr-${{ github.event.pull_request.number }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
